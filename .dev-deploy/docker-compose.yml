services:
  web-staking:
    build:
      context: ..
      dockerfile: .dev-deploy/web-staking.Dockerfile
    container_name: ${WEB_STAKING_CONTAINER_NAME}
    restart: always
    environment:
      NEXT_PUBLIC_APP_ENV: development
      MONGODB_URL: ${MONGODB_URL}
    networks:
      - cicd_github_deploy_network


networks:
  cicd_github_deploy_network:
    external: true